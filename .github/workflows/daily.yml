name: Daily PR digest

on:
  # 推代码就刷新页面 —— 只有 schedule 和 workflow_dispatch 的时候，改了分类逻辑
  # 推上来页面也不会动，线上一直停在上次跑的那版，而且没有任何报错提示。
  # push 触发只更新页面不发卡片（PAGE_ONLY=1 见下），免得每次提交都刷群。
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
  schedule:
    # 09:07 PDT / 08:07 PST。飞书文档明确提醒避开整点和半点 —— 那两个时刻
    # 全公司的定时任务一起打过来，容易撞限流。
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "回看窗口（小时）"
        required: false
        default: "25"
      page_only:
        description: "只更新页面，不发卡片（1/0）"
        required: false
        default: "0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 一次搜索同时产出页面和卡片，免得两者对不上。卡片里的链接指向固定的
      # Pages 地址：页面一两分钟后才部署好，但链接本身早就有效。
      - name: Build page and send card
        env:
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          LARK_SECRET: ${{ secrets.LARK_SECRET }}
          LARK_KEYWORD: ${{ secrets.LARK_KEYWORD }}
          # 没有它 search 只有 10 次/分钟，且「有效更新」过滤会整个跳过
          # （一轮上百个 timeline 请求，未认证 60 次/小时必然 403）
          GITHUB_TOKEN: ${{ github.token }}
          # 判级用的模型。凭据缺失则降级成规则打分，页面和日志都会标明。
          # 默认走 Anthropic；要换回 OpenAI 兼容网关就把仓库变量
          # LLM_PROVIDER 设成 openai，并配好 LLM_API_KEY / BASE_URL / MODEL。
          # 判定标准的「输入栏」：指向一个 issue，它的正文就是判级提示词。
          # 在浏览器里改完保存，下次运行即生效，不用碰代码。留空则用 criteria.py。
          CRITERIA_ISSUE: ${{ vars.CRITERIA_ISSUE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://ark.ap-southeast.bytepluses.com/api/v3' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'seed-sc-260628' }}
          PAGE_URL: ${{ vars.PAGE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          WINDOW_HOURS: ${{ inputs.window_hours || '25' }}
          # push 触发时只出页面不发卡片；定时和手动触发照常发
          PAGE_ONLY: ${{ github.event_name == 'push' && '1' || inputs.page_only || '0' }}
          REPORT_TZ: America/Los_Angeles
          OUT_DIR: site
        run: python3 watch.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
